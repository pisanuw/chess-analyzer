# Hosted read-only mirror: static frontend + the Express app as one function.
# Deployed from the analysing machine with scripts/publish-web.sh (no CI build).
[build]
  publish = "web-dist"

[functions]
  node_bundler = "esbuild"

[functions.api]
  # Pre-built clash index + narration are bundled too, so the mirror serves the
  # opening clash without an engine, the claude CLI, or parsing at request time.
  # Own and scout games share data/games/ (ownership is a field), so that one glob
  # covers every member's games. Per-member pattern notes and the roster are
  # bundled for the per-user Report and the login allowlist; per-member drills are
  # not files (they live in Supabase, key drills:<id>, populated by publish-web.sh).
  included_files = ["data/games/*.json", "data/patterns.json", "data/users/*/patterns.json", "data/users.json", "data/prepsheets.json", "data/scouts/*.json", "data/players.json", "data/clash.json", "data/clashnotes.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
