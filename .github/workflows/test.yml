name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The browser smoke test opens every page in headless Chromium against a
      # fixture data directory (no Stockfish, no model): a few seconds.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
